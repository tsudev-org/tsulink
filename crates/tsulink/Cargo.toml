[package]
name = "tsulink"
version = "0.5.0"
description = "Tsu Link - đồng bộ trực tiếp giữa thiết bị qua mạng nội bộ, không internet (tsudev-standards LOCAL_SYNC.md)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
automerge = "0.12.0"
base64 = "0.23"
blake3 = "1.8.7"
dryoc = { version = "=2.0.1", default-features = false, features = ["std"] }
getrandom = "0.4"
if-addrs = "0.15.0"
percent-encoding = "2.3"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
socket2 = "0.6.5"
thiserror = "2"
tokio = { version = "1.54.1", features = ["net", "time", "rt", "io-util", "sync", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
unicode-normalization = "0.1.26"
zeroize = "1.9.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
