[package]
name = "tsulink"
version = "0.2.0"
description = "Tsu Link - đồng bộ trực tiếp giữa thiết bị qua mạng nội bộ, không internet (tsudev-standards LOCAL_SYNC.md)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.22"
getrandom = "0.3"
if-addrs = "0.15.0"
percent-encoding = "2.3"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
socket2 = "0.6.5"
thiserror = "2"
tokio = { version = "1.54.1", features = ["net", "time", "rt", "io-util", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
zeroize = "1.9.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
