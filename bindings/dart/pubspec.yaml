name: tsulink
description: "Tsu Link - đồng bộ trực tiếp giữa thiết bị qua mạng nội bộ, không internet (ràng buộc flutter_rust_bridge của lõi Rust, ADR-0005)."
version: 0.6.0
homepage: https://github.com/tsudev-org/tsulink
repository: https://github.com/tsudev-org/tsulink
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  # PHẢI khớp `flutter_rust_bridge` trong rust/Cargo.toml và codegen (scripts/gen-dart-bridge.sh).
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
